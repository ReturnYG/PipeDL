name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - if: runner.os == 'Linux'
        run: python scripts/smoke.py src-tauri/target/debug/pipedl
      - if: runner.os == 'Windows'
        run: python scripts/smoke.py src-tauri/target/debug/pipedl.exe
      - if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          python scripts/ui_check.py
      - if: runner.os == 'Windows'
        run: npm run package -- --bundles nsis
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PipeDL-windows
          path: |
            src-tauri/target/release/pipedl.exe
            src-tauri/target/release/bundle/nsis/*.exe
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PipeDL-windows
          path: artifacts
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          cp artifacts/pipedl.exe release/PipeDL.exe
          cp artifacts/bundle/nsis/*.exe release/
          (cd release && sha256sum ./*.exe > SHA256SUMS)
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PipeDL $GITHUB_REF_NAME" --notes-file "$notes" release/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PipeDL $GITHUB_REF_NAME" --generate-notes release/*
          fi
